[project]
name = "batch-executor"
version = "0.1.0"
description = "FastAPI microservice for executing Gemini tasks in batches."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pyflow-ai-stack>=0.1.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.0",
  "pydantic-settings>=2.0.0",
  "asgi-lifespan>=2.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "black>=24.0.0",
  "isort>=5.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term --cov-fail-under=90"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
